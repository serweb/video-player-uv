<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UV Video Player</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="video-container">

    <iframe
      id="videoPlayer"
      src="https://www.xvideos.es/embedframe/ubmliav4a19?autoplay=1&muted=1"v
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen>
    </iframe>

  </div>

</body>
</html>
