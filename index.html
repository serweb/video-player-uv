<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Video Player</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    .video-container { position: fixed; inset: 0; background: #000; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    .nav button {
      background: rgba(0,0,0,.7);
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <iframe id="videoPlayer"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen></iframe>
  </div>
  <div class="nav">
    <button id="prev">Anterior</button>
    <button id="next">Siguiente</button>
  </div>
  <script>
    const items = (new URLSearchParams(location.search).get('v') || 'ubmliav4a19')
      .split(',')
      .map(s => s.trim())
      .filter(Boolean)
      .map(s => {
        const [id, sec] = s.split(':');
        return { id, sec: Number(sec) || 0 };
      });

    let i = 0;
    let timer;
    const frame = document.getElementById('videoPlayer');

    function load() {
      clearTimeout(timer);
      frame.src = 'https://www.xvideos.es/embedframe/' + items[i].id + '?autoplay=1';
      if (items[i].sec > 0) {
        timer = setTimeout(() => {
          i = (i + 1) % items.length;
          load();
        }, items[i].sec * 1000);
      }
    }

    document.getElementById('next').onclick = () => {
      i = (i + 1) % items.length;
      load();
    };
    document.getElementById('prev').onclick = () => {
      i = (i - 1 + items.length) % items.length;
      load();
    };

    load();
  </script>
</body>
</html>
